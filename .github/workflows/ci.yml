name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 is the reference environment: requirements.txt pins the exact
          # stack the shipped artifacts were produced on, and it is the only
          # version the published results were verified on end to end.
          - python-version: "3.11"
            install: "-r requirements.txt pytest"
          # 3.10 cannot take those pins (numpy 2.4.6 requires >=3.11), so it gets
          # the newest stack 3.10 accepts. The suite and the corpus-free metric
          # verification must still pass there; rebuilding the published map from
          # a corpus is not claimed. See the "Python 3.10" section of README.md.
          - python-version: "3.10"
            install: "numpy scipy scikit-learn matplotlib pytest"
        # Newer Pythons are not claimed to reproduce the paper's numbers, and
        # umap-learn cannot be built on 3.14 at all.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.install }}

      - name: Report the resolved environment
        # The published numbers are sensitive to the linear-algebra stack, so
        # record exactly what this job used. See CORRECTIONS.md #2.
        run: |
          python -c "import sys, numpy, scipy, sklearn; \
            print('python', sys.version); \
            print('numpy', numpy.__version__, 'scipy', scipy.__version__, \
                  'sklearn', sklearn.__version__)"
          python -c "import numpy; numpy.show_config()"

      - name: Syntax-check every pipeline script
        run: python -m py_compile code/*.py

      - name: Unit and integration tests
        run: python -m pytest tests/ -v --tb=short

      - name: Reproduce the published metrics from the shipped artifacts
        run: python code/verify_reference.py

      - name: Assert no corpus text is tracked
        # X_raw.npy and vocab.json can be reassembled into running text and must
        # never enter the repository. See data/README.md.
        run: |
          if git ls-files | grep -E '(X_raw\.npy|vocab\.json|100paper.*\.md|\.pdf$)'; then
            echo "::error::corpus-derived file is tracked in git"
            exit 1
          fi
          echo "clean: no corpus text tracked"
